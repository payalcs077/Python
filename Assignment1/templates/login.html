{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}
<h2>Login Page</h2>

<form method="POST">
    <label>Username:</label><br>
    <input type="text" name="username" required><br><br>

    <label>Password:</label><br>
    <input type="password" name="password" required><br><br>

    <button type="submit">Login</button>
</form>

{% if message %}
<p style="color:red;">{{ message }}</p>
{% endif %}

{% endblock %}
