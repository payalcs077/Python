{% extends "base.html" %}
{% block content %}

<h2>Author Dashboard</h2>

<a href="{{ url_for('main.create_post') }}" class="btn btn-primary mb-3">
    Create New Post
</a>

<p>Total Posts: {{ total_posts }}</p>

<hr>

{% for post in posts %}
    <div>
        <a href="{{ url_for('main.post_detail', post_id=post.id) }}">
            {{ post.title }}
        </a>
    </div>
{% else %}
    <p>No posts yet.</p>
{% endfor %}

{% endblock %}
