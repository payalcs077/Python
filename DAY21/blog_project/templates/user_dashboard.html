{% extends "base.html" %}
{% block content %}

<h2>User Dashboard</h2>
<p>Total Posts: {{ total_posts }}</p>

<hr>

{% for post in posts %}
    <div>
        <a href="{{ url_for('main.post_detail', post_id=post.id) }}">
            {{ post.title }}
        </a>
    </div>
{% else %}
    <p>No posts yet.</p>
{% endfor %}

{% endblock %}
