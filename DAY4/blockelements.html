<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Block Elements</title>
</head>
<body>

    <h1>Block Elements Example</h1>

    <div>This is a div element</div>

    <p>This is a paragraph element</p>

    <section>This is a section element</section>

    <article>This is an article element</article>

    <header>This is a header element</header>

    <footer>This is a footer element</footer>

    <ul>
        <li>List item 1</li>
        <li>List item 2</li>
    </ul>

    <form>
        <label>Name:</label>
        <input type="text">
    </form>

</body>
</html>
