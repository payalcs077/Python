<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inline Elements</title>
</head>
<body>

    <h1>Inline Elements Example</h1>

    <p>
        This is a 
        <span>span element</span>, 
        <a href="#">anchor tag</a>, 
        <strong>strong text</strong>, 
        <em>emphasized text</em>, 
        <b>bold text</b>, 
        <i>italic text</i>, 
        <u>underlined text</u>
        inside a paragraph.
    </p>

    <p>
        Image inline example:
        <img src="https://via.placeholder.com/50" alt="sample image">
    </p>

    <p>
        <input type="text" placeholder="inline input">
        <button>Inline Button</button>
    </p>

</body>
</html>
