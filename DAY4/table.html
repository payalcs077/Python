<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Table</title>
    <style>
        table {
            width: 60%;
            border-collapse: collapse;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h2 style="text-align:center;">Student Details</h2>

<table>
    <tr>
        <th>Roll No</th>
        <th>Name</th>
        <th>Course</th>
        <th>Marks</th>
    </tr>

    <tr>
        <td>1</td>
        <td>Payal</td>
        <td>M.Tech AI/ML</td>
        <td>90</td>
    </tr>

    <tr>
        <td>2</td>
        <td>Rahul</td>
        <td>B.Tech</td>
        <td>85</td>
    </tr>

    <tr>
        <td>3</td>
        <td>Anita</td>
        <td>MCA</td>
        <td>88</td>
    </tr>
</table>

</body>
</html>
